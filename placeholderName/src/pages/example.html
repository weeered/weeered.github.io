<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Форма обратной связи</title>
		<style>
			/* Базовые стили и сброс */
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			}

			body {
				background-color: #f5f7fa;
				color: #333;
				line-height: 1.6;
				padding: 20px;
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
			}

			.container {
				width: 100%;
				max-width: 600px;
				background: white;
				border-radius: 10px;
				box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
				overflow: hidden;
			}

			/* Заголовок формы */
			.form-header {
				background: #4a6ee0;
				color: white;
				padding: 25px 30px;
				text-align: center;
			}

			.form-header h1 {
				font-size: 24px;
				margin-bottom: 5px;
			}

			.form-header p {
				font-size: 14px;
				opacity: 0.9;
			}

			/* Тело формы */
			.form-body {
				padding: 30px;
			}

			/* Группы полей ввода */
			.input-group {
				margin-bottom: 20px;
			}

			.input-group label {
				display: block;
				margin-bottom: 8px;
				font-weight: 600;
				color: #444;
			}

			.input-group input,
			.input-group textarea {
				width: 100%;
				padding: 12px 15px;
				border: 1px solid #ddd;
				border-radius: 6px;
				font-size: 16px;
				transition: border 0.3s ease;
			}

			.input-group input:focus,
			.input-group textarea:focus {
				outline: none;
				border-color: #4a6ee0;
				box-shadow: 0 0 0 2px rgba(74, 110, 224, 0.2);
			}

			.input-group textarea {
				min-height: 120px;
				resize: vertical;
			}

			/* Валидация */
			.input-group .error {
				color: #e74c3c;
				font-size: 14px;
				margin-top: 5px;
				display: none;
			}

			.input-group.error .error {
				display: block;
			}

			.input-group.error input,
			.input-group.error textarea {
				border-color: #e74c3c;
			}

			/* Кнопка отправки */
			.submit-btn {
				background: #4a6ee0;
				color: white;
				border: none;
				padding: 14px 20px;
				width: 100%;
				border-radius: 6px;
				font-size: 16px;
				font-weight: 600;
				cursor: pointer;
				transition: background 0.3s ease;
			}

			.submit-btn:hover {
				background: #3a5dc9;
			}

			.submit-btn:disabled {
				background: #b0b0b0;
				cursor: not-allowed;
			}

			/* Уведомления */
			#form-notification {
				padding: 12px 15px;
				border-radius: 6px;
				margin-bottom: 20px;
				display: none;
			}

			#form-notification.success {
				background: #d4edda;
				color: #155724;
				border: 1px solid #c3e6cb;
				display: block;
			}

			#form-notification.error {
				background: #f8d7da;
				color: #721c24;
				border: 1px solid #f5c6cb;
				display: block;
			}

			/* Адаптивность */
			@media (max-width: 768px) {
				.container {
					box-shadow: none;
					border-radius: 0;
				}

				.form-body {
					padding: 20px;
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="form-header">
				<h1>Свяжитесь с нами</h1>
				<p>Заполните форму ниже, и мы ответим вам в ближайшее время</p>
			</div>

			<div class="form-body">
				<div id="form-notification"></div>

				<form id="feedbackForm">
					<div class="input-group">
						<label for="name">Ваше имя *</label>
						<input
							type="text"
							id="name"
							name="name"
							placeholder="Иван Иванов"
							required
						/>
						<div class="error">Пожалуйста, введите ваше имя</div>
					</div>

					<div class="input-group">
						<label for="email">Email *</label>
						<input
							type="email"
							id="email"
							name="email"
							placeholder="example@mail.com"
							required
						/>
						<div class="error">Пожалуйста, введите корректный email</div>
					</div>

					<div class="input-group">
						<label for="subject">Тема сообщения</label>
						<input
							type="text"
							id="subject"
							name="subject"
							placeholder="О чем вы хотите спросить?"
						/>
					</div>

					<div class="input-group">
						<label for="message">Сообщение *</label>
						<textarea
							id="message"
							name="message"
							placeholder="Ваше сообщение..."
							required
						></textarea>
						<div class="error">Пожалуйста, введите ваше сообщение</div>
					</div>

					<button type="submit" class="submit-btn">Отправить сообщение</button>
				</form>
			</div>
		</div>

		<script>
			document.addEventListener("DOMContentLoaded", function () {
				const form = document.getElementById("feedbackForm");
				const notification = document.getElementById("form-notification");

				// Функция для отображения уведомлений
				function showNotification(message, type) {
					notification.textContent = message;
					notification.className = "";
					notification.classList.add(type);

					// Скрыть уведомление через 5 секунд
					setTimeout(() => {
						notification.style.display = "none";
					}, 5000);
				}

				// Валидация формы
				function validateForm() {
					let isValid = true;

					// Проверка имени
					const nameInput = document.getElementById("name");
					const nameGroup = nameInput.parentElement;
					if (!nameInput.value.trim()) {
						nameGroup.classList.add("error");
						isValid = false;
					} else {
						nameGroup.classList.remove("error");
					}

					// Проверка email
					const emailInput = document.getElementById("email");
					const emailGroup = emailInput.parentElement;
					const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
					if (!emailRegex.test(emailInput.value.trim())) {
						emailGroup.classList.add("error");
						isValid = false;
					} else {
						emailGroup.classList.remove("error");
					}

					// Проверка сообщения
					const messageInput = document.getElementById("message");
					const messageGroup = messageInput.parentElement;
					if (!messageInput.value.trim()) {
						messageGroup.classList.add("error");
						isValid = false;
					} else {
						messageGroup.classList.remove("error");
					}

					return isValid;
				}

				// Обработка отправки формы
				form.addEventListener("submit", async function (e) {
					e.preventDefault();

					if (!validateForm()) {
						showNotification("Пожалуйста, исправьте ошибки в форме", "error");
						return;
					}

					// Получаем данные формы
					const formData = new FormData(form);
					const submitBtn = form.querySelector(".submit-btn");

					// Блокируем кнопку во избежание повторных отправок
					submitBtn.disabled = true;
					submitBtn.textContent = "Отправка...";

					try {
						// Отправляем данные на сервер
						const response = await fetch("sendmail.php", {
							method: "POST",
							body: formData,
						});

						const result = await response.json();

						if (result.success) {
							showNotification(
								"Ваше сообщение успешно отправлено! Мы свяжемся с вами скоро.",
								"success"
							);
							form.reset(); // Очищаем форму
						} else {
							showNotification(
								"Произошла ошибка при отправке: " + result.message,
								"error"
							);
						}
					} catch (error) {
						showNotification(
							"Ошибка сети: невозможно отправить сообщение",
							"error"
						);
						console.error("Ошибка:", error);
					} finally {
						// Разблокируем кнопку
						submitBtn.disabled = false;
						submitBtn.textContent = "Отправить сообщение";
					}
				});

				// Снятие сообщений об ошибках при вводе
				const inputs = form.querySelectorAll("input, textarea");
				inputs.forEach((input) => {
					input.addEventListener("input", function () {
						this.parentElement.classList.remove("error");
					});
				});
			});
		</script>
	</body>
</html>
